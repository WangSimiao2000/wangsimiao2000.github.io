name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
  # 每天重新构建一次：刷新友链存活检测（失效的站点自动移到「数字墓园」）
  schedule:
    - cron: "0 19 * * *" # 北京时间 03:00
  workflow_dispatch:

permissions:
  contents: read
  discussions: read # 留言板的留言变成秋林里的灯笼
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 文章的「更新于」取自 git 记录

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check friend links
        # 检测失败（如网络抖动）不阻塞部署，按全部存活处理
        continue-on-error: true
        run: node build/check-friends.mjs

      - name: Fetch guestbook lanterns
        # 留言板的留言 -> 秋林里的灯笼；失败不阻塞部署
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/fetch-guestbook.mjs

      - name: Fetch creator stats
        # B 站粉丝/视频/播放 + GitHub 贡献格子 -> 关于页；拉不到就用线上上一版，失败不阻塞部署
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/fetch-creator.mjs

      - name: Fetch Steam library
        # Steam 游戏库 -> 首页「游戏」板块和 /games/；拉不到就用线上上一版，失败不阻塞部署
        continue-on-error: true
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node build/fetch-steam.mjs

      - name: Fetch latest resume
        # 从 WangSimiao2000/Resume 取最新的 resume.pdf；下载失败或不是 PDF 就沿用仓库里的副本，不阻塞部署
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/resume.pdf" \
            https://raw.githubusercontent.com/WangSimiao2000/Resume/master/resume.pdf
          head -c 5 "$RUNNER_TEMP/resume.pdf" | grep -q '%PDF-'
          cp "$RUNNER_TEMP/resume.pdf" public/assets/resume/WangSimiao_resume.pdf
          cp "$RUNNER_TEMP/resume.pdf" public/assets/resume/WangSimiao_09.pdf

      - name: Build
        run: npm run build

      - name: Verify
        run: node build/verify.mjs

      - name: Keep previous assets
        # 部署后 10 分钟内拿着旧 HTML 的访客，仍能加载到配套的旧样式和脚本；失败不阻塞部署
        continue-on-error: true
        run: node build/keep-previous.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub Pages 偶尔在「同步文件」那一步卡住，deploy-pages 等满 10 分钟（它允许的上限）就中止并取消这次发布。
      # 这时用同一份产物再发一次：失败一次不算失败，第二次也失败才算
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
